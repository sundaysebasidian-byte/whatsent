[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsent"
version = "0.3.1"
description = "See what your AI coding agent sends, and where: canary project + local proxy + disk watch, one HTML report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.3.1", "psutil>=6",
    # Security floors also protect upgrades in environments retaining old transitive packages.
    "cryptography>=50.0.2", "flask>=3.1.3", "h2>=4.4.1", "hpack>=4.2.0",
    "jinja2>=3.1.6", "pyasn1>=0.6.4", "pyOpenSSL>=26.4.0", "werkzeug>=3.1.9",
    # Avoid obsolete YAML extensions and ASN.1 modules in minimum-version resolutions.
    "ruamel.yaml>=0.19.1", "service-identity>=26.1.0",
    # 6.6 fixes the remaining advisories but is currently excluded by mitmproxy.
    "tornado>=6.5.10",
]
keywords = [
    "ai", "agent", "privacy", "security", "audit", "mitmproxy", "claude-code", "codex",
    "copilot", "cursor", "privacy-audit", "canary-tokens", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=7", "zstandard>=0.23"]

[project.scripts]
whatsent = "whatsent.cli:main"

[project.urls]
Homepage = "https://github.com/sundaysebasidian-byte/whatsent"
Documentation = "https://github.com/sundaysebasidian-byte/whatsent/blob/main/README.md"
Issues = "https://github.com/sundaysebasidian-byte/whatsent/issues"
Changelog = "https://github.com/sundaysebasidian-byte/whatsent/blob/main/CHANGELOG.md"
Leaderboard = "https://sundaysebasidian-byte.github.io/whatsent/"

[tool.setuptools.package-data]
whatsent = ["_addon.py", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
