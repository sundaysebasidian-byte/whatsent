[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsent"
version = "0.3.0"
description = "See what your AI coding agent sends, and where: canary project + local proxy + disk watch, one HTML report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mitmproxy>=10", "psutil>=6"]
keywords = ["ai", "agent", "privacy", "security", "audit", "mitmproxy", "claude-code", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
whatsent = "whatsent.cli:main"

[project.urls]
Homepage = "https://github.com/sundaysebasidian-byte/whatsent"

[tool.setuptools.package-data]
whatsent = ["_addon.py", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
