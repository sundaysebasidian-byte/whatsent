name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            resolution: lowest
          - python: "3.13"
            resolution: highest
          - python: "3.14"
            resolution: highest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve runtime dependencies separately from audit tooling
        run: |
          python -m pip install uv==0.11.28 pip-audit==2.10.1
          python -m venv .audit-runtime
          uv pip install --python .audit-runtime/bin/python --resolution ${{ matrix.resolution }} .
          .audit-runtime/bin/python -m pip check
          .audit-runtime/bin/python -m pip freeze --exclude whatsent > runtime-requirements.txt
      - name: Exercise the minimum dependency set
        if: matrix.resolution == 'lowest'
        run: |
          .audit-runtime/bin/whatsent demo --out minimum-demo
          .audit-runtime/bin/whatsent board minimum-demo -o minimum-board
      - name: Audit runtime dependencies without hiding known findings
        run: |
          status=0
          pip-audit --disable-pip --no-deps -r runtime-requirements.txt --progress-spinner off -f json -o dependency-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python scripts/check_dependency_audit.py dependency-audit.json | tee dependency-audit-summary.txt
      - name: Show unresolved findings in the job summary
        if: always()
        run: |
          if [ -f dependency-audit-summary.txt ]; then
            cat dependency-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-python-${{ matrix.python }}
          path: |
            runtime-requirements.txt
            dependency-audit.json
            dependency-audit-summary.txt
          if-no-files-found: error
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -v
      - run: whatsent demo --out demo-report
      - run: whatsent board demo-report -o demo-board
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: whatsent check results examples/results
      - run: whatsent board results -o site
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/ui_workflows.test.js
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          whatsent --version
          python -c "from importlib.resources import files; p = files('whatsent'); assert all(p.joinpath(f).is_file() for f in ['_addon.py', 'ui/app.js', 'ui/app.css', 'ui/index.html', 'ui/icon.svg'])"
          whatsent demo --out package-demo
          whatsent board package-demo -o package-board
