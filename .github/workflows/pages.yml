name: pages

# Publishes the leaderboard, a sample report and the static live demo (site/demo/) to GitHub Pages.
# The demo replays events recorded from a real `whatsent ui` run (scripts/record_demo.py).
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Build the live demo and the sample report
        run: python scripts/build_demo_site.py site
      - name: Build leaderboard
        run: |
          if ls results/*.json >/dev/null 2>&1; then src=results; else src=examples/results; fi
          whatsent board "$src" -o site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
