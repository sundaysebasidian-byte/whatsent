name: pages

# Publishes the leaderboard and a sample report to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Build leaderboard
        run: |
          if ls results/*.json >/dev/null 2>&1; then src=results; else src=examples/results; fi
          whatsent board "$src" -o site
      - name: Add a sample report from the offline demo
        run: |
          whatsent demo --out "$RUNNER_TEMP/demo"
          cp "$RUNNER_TEMP"/demo/*/report.html site/sample-report.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
